<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAHIM ONLINE SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#111827;color:white;text-align:center;padding:30px 12px}
header h1{margin:0;font-size:27px}
header p{color:#d1d5db}
main{max-width:800px;margin:25px auto;padding:15px}
input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px}
h2{text-align:center}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.product,.cart{background:white;padding:16px 10px;border-radius:14px;text-align:center;box-shadow:0 3px 12px #0001}
.emoji{font-size:40px}
.price{color:#087f5b;font-weight:bold}
button{background:#111827;color:white;border:0;padding:11px;border-radius:8px;margin:4px;cursor:pointer}
.cart{margin-top:24px}
</style>
</head>
<body>
<header>
<h1>FAHIM ONLINE SHOP</h1>
<p>আপনার পছন্দের কেনাকাটা, এক জায়গায়!</p>
</header>
<main>
<input id="search" placeholder="পণ্য খুঁজুন..." oninput="showProducts()">
<h2>আমাদের পণ্য</h2>
<div id="products" class="products"></div>
<div class="cart">
<h2>🛒 আপনার কার্ট</h2>
<div id="cart">এখনো কোনো পণ্য যোগ করা হয়নি।</div>
<p id="total">মোট: 0 SAR</p>
</div>
</main>
<script>
const items=[
{name:"টি-শার্ট",price:35,emoji:"👕"},
{name:"জুতা",price:80,emoji:"👟"},
{name:"ঘড়ি",price:55,emoji:"⌚"},
{name:"ব্যাগ",price:45,emoji:"🎒"},
{name:"হেডফোন",price:60,emoji:"🎧"},
{name:"সানগ্লাস",price:25,emoji:"🕶️"}
];
let basket=[];
function showProducts(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=items.map((p,i)=>({ ...p,i })).filter(p=>p.name.includes(q)).map(p=>`<div class="product"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3><p class="price">${p.price} SAR</p><button onclick="addCart(${p.i})">কার্টে যোগ করুন</button></div>`).join("");
}
function addCart(i){basket.push(items[i]);showCart()}
function showCart(){
document.getElementById("cart").innerHTML=basket.length?basket.map((p,i)=>`${p.name} — ${p.price} SAR <button onclick="removeCart(${i})">বাদ দিন</button>`).join("<hr>"):"এখনো কোনো পণ্য যোগ করা হয়নি।";
document.getElementById("total").textContent="মোট: "+basket.reduce((s,p)=>s+p.price,0)+" SAR";
}
function removeCart(i){basket.splice(i,1);showCart()}
showProducts();
</script>
</body>
</html>
